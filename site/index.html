<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Krillium</title>
  <meta name="description" content="Which events to attend, and why, ranked by the buyers publicly attached to each one.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1612">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <nav class="rail" aria-label="Main" id="rail"></nav>
    <div class="stale-banner" id="stale" role="status" hidden></div>
    <main class="stage" id="main" tabindex="-1"></main>
  </div>
  <div class="signin" id="signin" hidden role="dialog" aria-modal="true" aria-labelledby="signin-title">
    <div class="signin-card glass">
      <div class="brand-lockup"><span id="signin-mark"></span><h1 id="signin-title">Krillium</h1></div>
      <p class="muted">Sign in with your team Google account to see which events to attend.</p>
      <div id="signin-button" class="signin-button"></div>
      <p class="signin-error" id="signin-error" role="alert" hidden></p>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
